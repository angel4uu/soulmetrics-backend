<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        body { font-family: Arial; padding: 30px; }
        h1 { color: #2c3e50; }
        .section { margin-bottom: 20px; }
    </style>
</head>
<body>

<h1>Personality Report</h1>

<div class="section">
    <h2>Summary</h2>
    <p>{{ profile.ai_summary }}</p>
</div>

<div class="section">
    <h2>Trends</h2>
    <p>{{ profile.ai_trends_analysis }}</p>
</div>

<div class="section">
    <h2>Recommendation</h2>
    <p>{{ profile.ai_recommendation }}</p>
</div>

<div class="section">
    <h2>Stats</h2>
    <p>Total tests: {{ profile.total_tests_taken }}</p>
    <p>Days active: {{ days_active }}</p>
</div>

</body>
</html>
