databases:
  - name: soulmetrics-db
    plan: free
    databaseName: soulmetrics
    user: soulmetrics

services:
  - type: web
    plan: free
    name: soulmetrics
    runtime: python
    buildCommand: './build.sh'
    startCommand: 'gunicorn soulmetrics.wsgi:application'
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: soulmetrics-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: WEB_CONCURRENCY
        value: 4
